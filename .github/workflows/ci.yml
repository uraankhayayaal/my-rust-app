name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Установка Rust toolchain через rustup (на раннере)
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Автотесты — точная команда: cargo test
      - name: Run cargo test
        run: cargo test

      # Статическая проверка
      - name: Run cargo check
        run: cargo check

      # Форматирование
      - name: Run cargo fmt --check
        run: cargo fmt -- --check

      # Lint
      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

  # QA gate: блокирует merge при падении автотестов
  qa:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # QA-автотесты: любое падение → exit != 0 → PR failed → merge заблокирован
      - name: Run QA tests
        run: cargo test -- --nocapture

  # Deploy: прод (Kubernetes). Стартует только после успешных test и qa.
  # SECRETS (GitHub Environments / Secrets): K8S_CONFIG (base64 kubeconfig), K8S_NAMESPACE
  deploy:
    runs-on: ubuntu-latest
    needs: [test, qa]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build release binary
        run: cargo build --release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: target/release/App

      # Deploy to Kubernetes (прод)
      - name: Deploy to K8s
        run: |
          echo "${{ secrets.K8S_CONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=./kubeconfig
          kubectl config use-context production
          kubectl apply -f k8s/ --namespace=${{ vars.K8S_NAMESPACE }}
