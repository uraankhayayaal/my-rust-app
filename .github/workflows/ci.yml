name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run go test
        run: go test ./...

      - name: Run QA integration tests
        run: cargo test -- --nocapture --test-threads=1

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: gofmt -l .

  # QA gate: блокирует merge и deploy при падении автотестов
  qa:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run QA tests
        run: cargo test -- --nocapture

  # Deploy: prod (Kubernetes). Starts only after successful test and qa.
  # SECRETS (GitHub Environments / Secrets): K8S_CONFIG (base64 kubeconfig), K8S_NAMESPACE
  deploy:
    runs-on: ubuntu-latest
    needs: [test, qa]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build release binary
        run: CGO_ENABLED=0 go build -o app .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app

      # Validate K8s manifests before applying
      - name: Validate K8s manifests
        run: kubectl apply -f k8s/ --dry-run=client --namespace=${{ vars.K8S_NAMESPACE }}

      # Deploy to Kubernetes (prod)
      - name: Deploy to K8s
        run: |
          echo "${{ secrets.K8S_CONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=./kubeconfig
          kubectl config use-context production
          kubectl apply -f k8s/ --namespace=${{ vars.K8S_NAMESPACE }}
