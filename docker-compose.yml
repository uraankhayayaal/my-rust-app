services:
  app:
    build:
      context: .
      target: dev
    container_name: app
    working_dir: /app
    volumes:
      - .:/app
      - app-logs:/app/logs
    command: go run .
    environment:
      LOG_LEVEL: info
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # QA: docker compose run --rm app go test ./...

volumes:
  app-logs:
